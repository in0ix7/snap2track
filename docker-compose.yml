version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: snap2track-postgres
    environment:
      POSTGRES_DB: snap2track
      POSTGRES_USER: snapuser
      POSTGRES_PASSWORD: snappass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapuser -d snap2track"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: